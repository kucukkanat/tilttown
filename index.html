<!DOCTYPE html>
<html lang="en">
<head>
<meta name="tilt-build" content="__BUILD__">
<script id="tiltUpd">(function(){var B='__BUILD__';function chk(){if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(function(r){return r.ok?r.text():''}).then(function(t){var m=t.match(/name="tilt-build" content="([^"]+)"/);if(!m||m[1]===B)return;var u=new URL(location.href);if(u.searchParams.get('v')===m[1])return;u.searchParams.set('v',m[1]);location.replace(u.toString());}).catch(function(){});}chk();document.addEventListener('visibilitychange',function(){if(!document.hidden)chk();});addEventListener('pageshow',function(e){if(e.persisted)chk();});})();</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tilt Town</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="title"><h1>Tilt Town</h1><p>Tap people and houses · drag to orbit · pinch to zoom</p></div>
<div id="presets" class="panel"></div>
<div id="bar" class="panel">
  <div id="tools"></div>
  <div class="row"><b id="clk">07:36</b><input id="time" type="range" min="0" max="24" step="0.01" value="7.6">
    <span class="spd"><button class="act" data-s="0">II</button><button class="act on" data-s="1">1×</button><button class="act" data-s="4">4×</button></span>
    <button class="act" id="snd">♪ Sound</button><button class="act" id="undoB" title="Undo">↶</button><button class="act" id="menu">Menu</button><button id="rand" hidden></button><button id="clear" hidden></button></div>
</div>
<div id="hint" class="panel"></div>
<div id="card" class="panel"></div>
<div id="chips"><button id="eco" class="panel"></button><button id="goalsBtn" class="panel chip">★ 0</button><button id="reqs" class="panel chip">Requests 0</button><button id="eventChip" class="panel chip hot" style="display:none"></button><button id="scenChip" class="panel chip" style="display:none"></button><button id="paperBtn" class="panel chip">Paper</button></div>
<button id="photoExit" class="panel">Exit photo mode</button><button id="snapB" class="panel">Snap postcard</button>
<div id="tut" class="panel"></div>
<div id="toast" class="panel"></div>
<div id="bubbles"></div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
